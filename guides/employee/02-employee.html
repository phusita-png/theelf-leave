  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

owrap\">❌ ไม่อนุมัติ<\u002Fspan><\u002Fdiv><div style=\"padding:12px 18px;color:#6E6762\">ถูกปฏิเสธ (ดูเหตุผลที่ HR แจ้ง)<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:.5fr 1fr;border-top:1px solid #EDE8E4;background:#FCFAF9;font-size:13.5px\"><div style=\"padding:12px 18px\"><span style=\"background:#F6F3FA;color:#6B46C1;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap\">✏️ ต้องแก้ไข<\u002Fspan><\u002Fdiv><div style=\"padding:12px 18px;color:#6E6762\">HR ส่งกลับให้แก้ → กดปุ่ม “แก้ไขแล้วส่งใหม่”<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ===== PROFILE + DOCS ===== -->\n      <div data-break=\"\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:24px\">\n        <div data-avoid=\"\">\n          <div style=\"display:flex;align-items:center;gap:11px;margin-bottom:12px\"><span style=\"width:36px;height:36px;border-radius:10px;background:#FCEBEA;color:#C0140F;display:flex;align-items:center;justify-content:center;font-size:17px\">🙂<\u002Fspan><h2 style=\"font-family:'Anuphan',sans-serif;font-weight:700;font-size:20px;line-height:1.2;margin:0\">โปรไฟล์<\u002Fh2><\u002Fdiv>\n          <div style=\"font-size:14px;color:#6E6762;line-height:1.65\">แสดงข้อมูลของคุณ (อ่านอย่างเดียว): รูป + ชื่อ + แผนก · วันลาคงเหลือ 🌴🏠🤒 · รหัสพนักงาน · สิทธิ์ใช้งาน · OT รอบนี้<\u002Fdiv>\n          <div style=\"margin-top:11px;display:flex;gap:9px;background:#FEF6E7;border:1px solid #F7E2B3;border-radius:11px;padding:10px 12px;font-size:12.5px;color:#8A5A06;line-height:1.5\"><span>ℹ️<\u002Fspan><span>ข้อมูลไม่ถูกต้อง (ชื่อ/แผนก/สิทธิ์) → แจ้ง HR แก้ไขให้<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div data-avoid=\"\">\n          <div style=\"display:flex;align-items:center;gap:11px;margin-bottom:12px\"><span style=\"width:36px;height:36px;border-radius:10px;background:#FCEBEA;color:#C0140F;display:flex;align-items:center;justify-content:center;font-size:17px\">💰<\u002Fspan><h2 style=\"font-family:'Anuphan',sans-serif;font-weight:700;font-size:20px;line-height:1.2;margin:0\">เอกสาร &amp; สลิป<\u002Fh2><\u002Fdiv>\n          <div style=\"font-size:14px;color:#6E6762;line-height:1.65\">ดูสลิปเงินเดือน: รายได้สุทธิ + ปุ่ม 📄 เปิดสลิป PDF · รายละเอียดรายรับ/OT/ปกส./ภาษี · ยอดสะสมทั้งปี (YTD) · สลิปย้อนหลัง · เอกสารบริษัท (หนังสือรับรอง · นโยบายวันลา · แบบฟอร์ม)<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- slip mock -->\n      <div data-avoid=\"\" style=\"display:flex;justify-content:center;gap:24px;align-items:center;background:#FBF9F8;border:1px solid #EFEAE6;border-radius:20px;padding:26px;margin-bottom:54px;flex-wrap:wrap\">\n        <div style=\"width:226px;background:linear-gradient(150deg,#2A2520,#131110);padding:8px;border-radius:36px;box-shadow:0 22px 40px -20px rgba(27,23,20,.45)\">\n          <div style=\"background:#fff;border-radius:29px;overflow:hidden;display:flex;flex-direction:column;min-height:432px\">\n            <div style=\"background:linear-gradient(135deg,#E5231C,#BE130E);padding:14px 15px;color:#fff\"><div style=\"font-size:10px;opacity:.85\">สลิปเงินเดือน · พ.ค. 2569<\u002Fdiv><div style=\"font-family:'Anuphan',sans-serif;font-weight:700;font-size:21px;margin-top:3px\">฿ 32,450<\u002Fdiv><div style=\"font-size:10px;opacity:.85\">รายได้สุทธิ<\u002Fdiv><\u002Fdiv>\n            <div style=\"padding:13px 15px\">\n              <div style=\"display:flex;justify-content:space-between;font-size:11.5px;padding:5px 0;color:#6E6762\"><span>รวมรายรับ<\u002Fspan><span style=\"font-weight:600;color:#1B1714\">38,000<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;font-size:11.5px;padding:5px 0;color:#6E6762\"><span>OT<\u002Fspan><span style=\"font-weight:600;color:#1E9E5A\">+2,150<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;font-size:11.5px;padding:5px 0;color:#6E6762\"><span>ประกันสังคม<\u002Fspan><span style=\"font-weight:600;color:#C0140F\">−750<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;font-size:11.5px;padding:5px 0;border-bottom:1px solid #F0ECE9;color:#6E6762\"><span>ภาษีหัก ณ ที่จ่าย<\u002Fspan><span style=\"font-weight:600;color:#C0140F\">−950<\u002Fspan><\u002Fdiv>\n              <div style=\"margin-top:11px;border:1.5px solid #E5231C;color:#C0140F;border-radius:11px;padding:9px;text-align:center;font-size:12px;font-weight:600\">📄 เปิดสลิป PDF<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"max-width:300px\">\n          <div style=\"font-family:'Anuphan',sans-serif;font-size:13px;font-weight:600;color:#C0140F;letter-spacing:.04em;margin-bottom:8px\">หน้าเอกสาร<\u002Fdiv>\n          <div style=\"font-size:14.5px;line-height:1.65;color:#6E6762\">หัวสลิปบอกรายได้สุทธิเดือนล่าสุด กดดูรายละเอียดได้ครบ พร้อมยอดสะสมทั้งปี (YTD) · กดปุ่ม 📄 เพื่อ <strong style=\"color:#1B1714\">เปิดดูในแอป<\u002Fstrong> หรือ <strong style=\"color:#1B1714\">ดาวน์โหลด / เปิดเต็มจอ<\u002Fstrong><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ===== EDIT & RESUBMIT ===== -->\n      <div data-break=\"\" data-avoid=\"\" style=\"background:#F6F3FA;border:1px solid #E4DCF0;border-radius:22px;padding:32px 34px;margin-bottom:48px\">\n        <div style=\"display:flex;align-items:center;gap:11px;margin-bottom:16px\"><span style=\"width:38px;height:38px;border-radius:11px;background:#6B46C1;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px\">✏️<\u002Fspan><h2 style=\"font-family:'Anuphan',sans-serif;font-weight:700;font-size:22px;line-height:1.2;margin:0;letter-spacing:-.01em\">เมื่อ HR ส่งใบกลับมาให้แก้ไข<\u002Fh2><\u002Fdiv>\n        <p style=\"margin:0 0 18px;font-size:14.5px;color:#4A4550;line-height:1.6\">ถ้า HR เห็นว่าใบลา/OT มีจุดต้องแก้ จะ “ส่งกลับให้แก้ไข” แทนการปฏิเสธ — ใบยังอยู่ ไม่ต้องเริ่มใหม่<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px\">\n          <div style=\"background:#fff;border:1px solid #E4DCF0;border-radius:14px;padding:16px\"><div style=\"font-family:'Anuphan',sans-serif;font-weight:700;color:#6B46C1;font-size:13px;margin-bottom:6px\">1<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:#4A4550\">ในหน้าประวัติ ใบนั้นขึ้นป้าย ✏️ ต้องแก้ไข + ปุ่ม “แก้ไขแล้วส่งใหม่”<\u002Fdiv><\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #E4DCF0;border-radius:14px;padding:16px\"><div style=\"font-family:'Anuphan',sans-serif;font-weight:700;color:#6B46C1;font-size:13px;margin-bottom:6px\">2<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:#4A4550\">กดปุ่ม → เปิดฟอร์มเดิมที่กรอกข้อมูลเก่าไว้ให้แล้ว พร้อมแถบกำลังแก้ไข<\u002Fdiv><\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #E4DCF0;border-radius:14px;padding:16px\"><div style=\"font-family:'Anuphan',sans-serif;font-weight:700;color:#6B46C1;font-size:13px;margin-bottom:6px\">3<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:#4A4550\">แก้จุดที่ต้องการ → กด “ส่งการแก้ไข” → ✅ ส่งกลับให้ HR อีกรอบ<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ===== FAQ ===== -->\n      <div data-avoid=\"\" style=\"display:flex;align-items:center;gap:11px;margin-bottom:8px\">\n        <span style=\"width:30px;height:30px;border-radius:9px;background:#FCEBEA;color:#C0140F;display:flex;align-items:center;justify-content:center;font-size:15px\">❓<\u002Fspan>\n        <h2 style=\"font-family:'Anuphan',sans-serif;font-weight:700;font-size:23px;line-height:1.25;margin:0;letter-spacing:-.01em;white-space:nowrap\">ปัญหาที่พบบ่อย<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 20px;font-size:15px;color:#6E6762\">ติดตรงไหน ลองวิธีนี้ก่อน<\u002Fp>\n      <div data-avoid=\"\" style=\"border:1px solid #EDE8E4;border-radius:18px;overflow:hidden;margin-bottom:48px\">\n        <div style=\"display:grid;grid-template-columns:1fr 1.4fr;background:#FBF6F5;font-size:12.5px;font-weight:700;color:#C0140F\"><div style=\"padding:13px 18px\">สิ่งที่เจอ<\u002Fdiv><div style=\"padding:13px 18px\">วิธีแก้<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1.4fr;border-top:1px solid #EDE8E4;font-size:13.5px;line-height:1.5\"><div style=\"padding:14px 18px;font-weight:600\">เลือกวันลาแล้วกดส่งไม่ได้<\u002Fdiv><div style=\"padding:14px 18px;color:#6E6762\">ตรวจว่าเลือกวันครบ · ถ้ารายชั่วโมง ต้องใส่เวลา (0–8 ชม.)<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1.4fr;border-top:1px solid #EDE8E4;background:#FCFAF9;font-size:13.5px;line-height:1.5\"><div style=\"padding:14px 18px;font-weight:600\">ครึ่งเช้า/ครึ่งบ่ายกดไม่ได้<\u002Fdiv><div style=\"padding:14px 18px;color:#6E6762\">ใช้ได้เฉพาะลาวันเดียว — ลาหลายวันต้องเต็มวัน<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1.4fr;border-top:1px solid #EDE8E4;font-size:13.5px;line-height:1.5\"><div style=\"padding:14px 18px;font-weight:600\">OT เลือกวันที่ไม่ได้<\u002Fdiv><div style=\"padding:14px 18px;color:#6E6762\">ย้อนหลังเกิน 30 วันกดไม่ได้<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1.4fr;border-top:1px solid #EDE8E4;background:#FCFAF9;font-size:13.5px;line-height:1.5\"><div style=\"padding:14px 18px;font-weight:600\">โหลดข้อมูลไม่ขึ้น / ค้าง<\u002Fdiv><div style=\"padding:14px 18px;color:#6E6762\">ปิดแล้วเปิดแอปใหม่ · เช็คเน็ต · ถ้าขึ้น “เชื่อมต่อไม่ได้” ลองใหม่อีกครั้ง<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1.4fr;border-top:1px solid #EDE8E4;font-size:13.5px;line-height:1.5\"><div style=\"padding:14px 18px;font-weight:600\">แอปให้ล็อกอินใหม่<\u002Fdiv><div style=\"padding:14px 18px;color:#6E6762\">ปกติ — ระบบรีเฟรชความปลอดภัย กดล็อกอินต่อได้เลย<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ===== FOOTER ===== -->\n    <div data-avoid=\"\" style=\"background:#1B1714;color:#fff;padding:38px 52px;display:flex;align-items:center;gap:20px;flex-wrap:wrap\">\n      <span style=\"width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:22px\">👥<\u002Fspan>\n      <div style=\"flex:1;min-width:220px\">\n        <div style=\"font-family:'Anuphan',sans-serif;font-weight:600;font-size:18px;margin-bottom:5px\">พบปัญหาการใช้งาน? ติดต่อ HR<\u002Fdiv>\n        <div style=\"font-size:14px;opacity:.7;line-height:1.55\">หากพบปัญหาการใช้งาน หรือข้อมูลส่วนตัวไม่ถูกต้อง กรุณาติดต่อฝ่าย HR<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;opacity:.5;line-height:1.6;text-align:right\">คู่มือสำหรับพนักงาน บจก.ดิเอลฟ์<br>จัดทำเพื่อใช้ภายในองค์กร · v.71<\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  renderVals() {\n    return { printPage: () => window.print() };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
