<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <!-- index.html เองไม่มี ?v= ให้ bump — เบราว์เซอร์เคยค้างของเก่าจนไม่เห็นงานใหม่
       (เคสจริง 28 ส.ค.: แก้ CSS + bump แล้ว แต่หน้ายังเป็นของเดิม) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#cc1019">
  <title>The Elf · ระบบเงินเดือน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=11">
  <style>
    /* หน้าเดี่ยว = โมดูลกินเต็มจอ · ในคอนโซลจะถูกครอบด้วยกรอบเนื้อหาแทน */
    html, body { margin: 0; min-height: 100%; }
    #payHost { min-height: 100vh; }
  </style>
</head>
<body>

  <!--
    หน้านี้เป็นแค่ "ที่วาง" ของโมดูล window.PAY — โครงหน้าจอทั้งหมดอยู่ใน app.js
    เพราะโมดูลตัวเดียวกันถูกฝังในคอนโซลลา (เมนู "จัดการ Payroll") ด้วย
    ถ้าแยก markup ไว้ 2 ที่ แก้หน้าตาทีต้องตามแก้ 2 รอบ = ลืมแน่นอน

    เปิดหน้านี้ตรงๆ มีประโยชน์ตอน debug (ไม่ต้องผ่านคอนโซล) — ล็อกอิน LIFF เอง
  -->
  <div id="payHost"></div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="config.js?v=2"></script>
  <script src="app.js?v=13"></script>
  <script>
    PAY.mount(document.getElementById('payHost'), window.PAYROLL_CONFIG);
  </script>
</body>
</html>
