<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <!-- index.html เองไม่มี ?v= ให้ bump — เบราว์เซอร์เคยค้างของเก่าจนไม่เห็นงานใหม่
       (เคสจริง 28 ส.ค.: แก้ CSS + bump แล้ว แต่หน้ายังเป็นของเดิม) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#cc1019">
  <title>The Elf · ระบบลา & OT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=24">
  <!-- โมดูลเงินเดือน (เมนู "จัดการ Payroll") — CSS ครอบใต้ .pay-scope ไม่ทับของคอนโซล -->
  <link rel="stylesheet" href="payroll/styles.css?v=17">
</head>
<body>

  <!-- ░░ LOADING ░░ -->
  <div id="loader" class="loader">
    <div class="loader-logo">
      <img src="logo.png" alt="The Elf" onerror="this.style.display='none';this.parentNode.classList.add('noimg')">
    </div>
    <div class="loader-bar"><i></i></div>
    <div class="loader-text">กำลังโหลด…</div>
  </div>

  <!-- ░░ APP ░░ -->
  <div id="app" class="app hidden">

    <!-- Header -->
    <header class="hd">
      <div class="hd-logo">
        <img src="logo.png" alt="The Elf" onerror="this.style.display='none';this.parentNode.classList.add('noimg')">
      </div>
      <div class="hd-mid">
        <div class="hd-title" id="hdTitle">ระบบลา & OT</div>
        <div class="hd-sub" id="hdSub">บจก.ดิเอลฟ์</div>
      </div>
      <div id="hd-avatar" class="hd-avatar"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg></div>
    </header>

    <!-- Topbar (desktop เท่านั้น · โชว์ชื่อเมนูที่กด — แทน header แดง) -->
    <div id="topbar" class="topbar">
      <span class="tb-icon" id="tbIcon"></span>
      <div class="tb-mid">
        <div class="tb-title" id="tbTitle">ระบบลา &amp; OT</div>
        <div class="tb-sub" id="tbSub">บจก.ดิเอลฟ์</div>
      </div>
      <div id="tb-avatar" class="tb-avatar"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg></div>
    </div>

    <!-- Views -->
    <main id="main" class="main"></main>

    <!-- Bottom nav (มือถือ) / Sidebar (desktop) -->
    <nav class="nav">
      <!-- ░ Brand (desktop sidebar เท่านั้น · แทนโลโก้ในแถบแดง) ░ -->
      <div class="nav-brand">
        <span class="nb-logo"><img src="logo.png" alt="The Elf" onerror="this.style.display='none';this.parentNode.classList.add('noimg')"></span>
        <div class="nb-txt">The Elf<small>HR Console</small></div>
      </div>
      <!-- ═══ ก้อน HR (desktop เท่านั้น · ตามสิทธิ์) ═══ -->
      <div class="nav-sec">ภาพรวม</div>
      <button class="nav-btn nav-admin" data-view="dashboard" aria-label="แดชบอร์ด"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><path d="M7 20v-6M12 20V7M17 20v-9"/></svg><span>แดชบอร์ด</span></button>
      <button class="nav-btn nav-admin" data-view="leavecal" aria-label="ปฏิทินการลา"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.2"/><path d="M3.5 9.6h17M8.5 3v4M15.5 3v4"/></svg><span>ปฏิทินการลา</span></button>
      <div class="nav-sec">ดำเนินการ</div>
      <button class="nav-btn nav-admin" data-view="hr" aria-label="อนุมัติทั้งหมด"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.3l2.4 2.4 4.6-4.9"/></svg><span>อนุมัติทั้งหมด</span></button>
      <button class="nav-btn nav-admin" data-view="mgleave" aria-label="จัดการการลา"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4.5" width="12" height="16" rx="2"/><rect x="9" y="2.6" width="6" height="3.6" rx="1.2"/><path d="M9.5 11h5M9.5 15h5"/></svg><span>จัดการการลา</span></button>
      <button class="nav-btn nav-admin" data-view="mgot" aria-label="จัดการ OT"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 1.8"/></svg><span>จัดการ OT</span></button>
      <button class="nav-btn nav-admin" data-view="mgpay" aria-label="จัดการ Payroll"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12.5" rx="2.4"/><path d="M3 10.5h18"/><circle cx="16.5" cy="14.6" r="1.4"/></svg><span>จัดการ Payroll</span></button>
      <div class="nav-sec">จัดการ</div>
      <button class="nav-btn nav-admin" data-view="emps" aria-label="พนักงาน"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19.5a5.5 5.5 0 0 1 11 0"/><path d="M16 5.4a3.2 3.2 0 0 1 0 6.2M17.5 19.5a5.6 5.6 0 0 0-2-4.3"/></svg><span>พนักงาน</span></button>
      <!-- ⚙️ ตั้งค่าระบบ (วันหยุดบริษัท · กะ · โควต้ามาตรฐาน) — ซ่อนไว้ก่อน ยังไม่มีเนื้อหาจริง -->
      <!-- ═══ ก้อนของฉัน (มือถือ = bottom nav 6 ปุ่มนี้) ═══ -->
      <div class="nav-sec">ข้อมูลของฉัน</div>
      <button class="nav-btn active" data-view="home" aria-label="หน้าหลัก">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg>
        <span>หน้าหลัก</span>
      </button>
      <button class="nav-btn" data-view="profile" aria-label="โปรไฟล์">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-6 8-6s8 2 8 6"/></svg>
        <span>โปรไฟล์</span>
      </button>
      <button class="nav-btn" data-view="leave" aria-label="ขอลา">
        <svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/></svg>
        <span>ขอลา</span>
      </button>
      <button class="nav-btn" data-view="ot" aria-label="ขอ OT">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12.5" r="8.5"/><path d="M12 8v5l3 2M12 2.5h0"/></svg>
        <span>ขอ OT</span>
      </button>
      <button class="nav-btn" data-view="payslip" aria-label="เอกสาร">
        <svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9h0M18 15h0"/></svg>
        <span>เอกสาร</span>
      </button>
      <button class="nav-btn" data-view="history" aria-label="ประวัติ">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span>ประวัติ</span>
      </button>
    </nav>

    <!-- ปุ่มคู่มือ (ลอยมุมจอ · เปิด overlay คู่มือตาม role) -->
    <button id="helpFab" class="help-fab" aria-label="คู่มือการใช้งาน" title="คู่มือการใช้งาน"><span class="hf-ic"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2 2 0 0 1 6 3.5h5.5v16H6a2 2 0 0 0-2 2Z"/><path d="M20 5.5a2 2 0 0 0-2-2h-6.5v16H18a2 2 0 0 1 2 2Z"/></svg></span><span class="hf-tx">คู่มือการใช้</span></button>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="config.js?v=31"></script>
  <script src="payroll/app.js?v=20"></script>
  <script src="app.js?v=134"></script>
</body>
</html>
